services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: executive_connect
      POSTGRES_PASSWORD: executive_connect
      POSTGRES_DB: executive_connect
    ports:
      - "5432:5432"
    volumes:
      - executive_connect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executive_connect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  executive_connect_pg:
