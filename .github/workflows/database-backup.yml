name: Database backup

# Nightly encrypted backup of the production database, kept as a workflow artifact for 90 days.
# Needs repository secrets RAILWAY_TOKEN and BACKUP_PASSPHRASE. The repository is public, so the dump
# is encrypted (AES-256) before upload; without the passphrase the file is unreadable.
#
# Restore (on any machine with Docker):
#   1. Actions > Database backup > pick a run > download the "database-backup-..." artifact and unzip it.
#   2. gpg --batch --pinentry-mode loopback --passphrase 'YOUR_PASSPHRASE' -d backup.dump.gpg > backup.dump
#   3. docker run --rm -i postgres:18 pg_restore --clean --if-exists --no-owner -d 'DATABASE_URL' < backup.dump
on:
  schedule:
    - cron: '17 22 * * *' # 02:17 Dubai
  workflow_dispatch:
    inputs:
      project:
        description: Railway project name
        default: amiable-insight
      environment:
        description: Railway environment name
        default: production

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PROJECT: ${{ inputs.project || 'amiable-insight' }}
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
    steps:
      - name: Dump and encrypt
        run: |
          set -euo pipefail
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::Add the RAILWAY_TOKEN repository secret first"; exit 1; }
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "::error::Add the BACKUP_PASSPHRASE repository secret first"; exit 1; }
          API=https://backboard.railway.com/graphql/v2

          gql() { # $1 = query, $2 = variables JSON (optional)
            local vars=${2:-}
            [ -n "$vars" ] || vars='{}'
            curl -sS "$API" -H "$AUTH" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg q "$1" --argjson v "$vars" '{query:$q,variables:$v}')"
          }

          FIELDS='id name environments { edges { node { id name } } } services { edges { node { id name } } }'

          # Account/workspace token first, then project token.
          AUTH="Authorization: Bearer $RAILWAY_TOKEN"
          P=$(gql "{ projects { edges { node { $FIELDS } } } }" | jq -c --arg p "$PROJECT" '.data.projects.edges[]?.node | select(.name==$p)' | head -1)
          if [ -z "$P" ]; then
            AUTH="Project-Access-Token: $RAILWAY_TOKEN"
            PID=$(gql '{ projectToken { projectId } }' | jq -r '.data.projectToken.projectId // empty')
            [ -n "$PID" ] || { echo "::error::Token rejected or project '$PROJECT' not found"; exit 1; }
            P=$(gql "query(\$id:String!){ project(id:\$id){ $FIELDS } }" "{\"id\":\"$PID\"}" | jq -c '.data.project')
          fi
          PID=$(echo "$P" | jq -r .id)
          ENV_ID=$(echo "$P" | jq -r --arg e "$ENVIRONMENT" '.environments.edges[].node | select(.name==$e) | .id')

          # The Postgres service publishes its public connection string as DATABASE_PUBLIC_URL.
          URL=""
          for sid in $(echo "$P" | jq -r '.services.edges[].node.id'); do
            URL=$(gql 'query($p:String!,$e:String!,$s:String!){ variables(projectId:$p, environmentId:$e, serviceId:$s) }' \
              "{\"p\":\"$PID\",\"e\":\"$ENV_ID\",\"s\":\"$sid\"}" | jq -r '.data.variables.DATABASE_PUBLIC_URL // empty')
            [ -n "$URL" ] && break
          done
          [ -n "$URL" ] || { echo "::error::No DATABASE_PUBLIC_URL found. In Railway, enable the Postgres service's public TCP proxy (Settings > Networking)."; exit 1; }
          echo "::add-mask::$URL"

          docker run --rm postgres:18 pg_dump --format=custom --no-owner "$URL" > backup.dump
          SIZE=$(stat -c %s backup.dump)
          [ "$SIZE" -gt 1000 ] || { echo "::error::Backup looks empty ($SIZE bytes)"; exit 1; }

          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o backup.dump.gpg backup.dump
          shred -u backup.dump
          echo "::notice title=Backup created::$(date -u +%FT%TZ), $SIZE bytes before encryption"
          echo "STAMP=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_ENV"

      - name: Store encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ env.STAMP }}
          path: backup.dump.gpg
          retention-days: 90
          if-no-files-found: error
